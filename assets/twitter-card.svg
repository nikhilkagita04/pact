<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <!-- Background -->
  <rect width="1200" height="600" fill="#121212"/>
  
  <!-- Main content centered -->
  <g transform="translate(600, 300)">
    <!-- Pact. logo -->
    <text x="0" y="-30" 
          font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="80" 
          font-weight="500" 
          letter-spacing="-0.5px" 
          text-anchor="middle" 
          fill="white">Pact.</text>
    
    <!-- Tagline -->
    <text x="0" y="30" 
          font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="400" 
          text-anchor="middle" 
          fill="#E0DDD4">Be the person everyone can count on.</text>
    
    <!-- Subtle accent line -->
    <rect x="-100" y="60" width="200" height="3" fill="#4fd1c7" opacity="0.6"/>
  </g>
</svg>
