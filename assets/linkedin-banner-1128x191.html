<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Banner - 1128x191</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .banner {
            width: 1128px;
            height: 191px;
            background: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
        }
        .title {
            font-size: 48px;
            font-weight: 500;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            line-height: 1;
        }
        .tagline {
            font-size: 16px;
            font-weight: 400;
            color: #E0DDD4;
            text-align: center;
        }
        /* Instructions */
        .instructions {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="instructions">
        Right-click on the banner below → "Save image as..." or take a screenshot<br>
        Size: 1128×191px - Perfect for LinkedIn company page banner
    </div>
    
    <div class="banner">
        <div class="title">Pact.</div>
        <div class="tagline">Be the person everyone can count on.</div>
    </div>
</body>
</html>
